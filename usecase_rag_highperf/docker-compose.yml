services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey-bundle:latest
    ports:
      - "6379:6379"
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-valkey}
    command: valkey-server --requirepass ${VALKEY_PASSWORD:-valkey}
    volumes:
      - vkdata:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a ${VALKEY_PASSWORD:-valkey} ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  vkdata:
