services:
  # MySQL 8.0 Cluster Nodes
  mysql80-1:
    image: mysql:8.0.42
    container_name: mysql80-1
    restart: always
    hostname: mysql80-1
    command: ["mysqld", "--server-id=1", "--gtid_mode=ON", "--enforce_gtid_consistency=ON", "--binlog_checksum=NONE", "--default-authentication-plugin=mysql_native_password", "--binlog_transaction_dependency_tracking=WRITESET"]
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_ROOT_HOST: '%'
    ports:
      - "33062:3306"
    networks:
      - cluster_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql80-2:
    image: mysql:8.0.42
    container_name: mysql80-2
    restart: always
    hostname: mysql80-2
    command: ["mysqld", "--server-id=2", "--gtid_mode=ON", "--enforce_gtid_consistency=ON", "--binlog_checksum=NONE", "--default-authentication-plugin=mysql_native_password", "--binlog_transaction_dependency_tracking=WRITESET"]
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_ROOT_HOST: '%'
    ports:
      - "33063:3306"
    networks:
      - cluster_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql80-3:
    image: mysql:8.0.42
    container_name: mysql80-3
    restart: always
    hostname: mysql80-3
    command: ["mysqld", "--server-id=3", "--gtid_mode=ON", "--enforce_gtid_consistency=ON", "--binlog_checksum=NONE", "--default-authentication-plugin=mysql_native_password", "--binlog_transaction_dependency_tracking=WRITESET"]
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_ROOT_HOST: '%'
    ports:
      - "33064:3306"
    networks:
      - cluster_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MySQL 8.4 Cluster Nodes
  # Note: mysql_native_password is deprecated in 8.4. We use it here for comparison consistency, 
  # but in 8.4 we might need to be careful. 
  # In 8.4, --default-authentication-plugin is deprecated/removed? 
  # It is --authentication_policy in 8.4? 
  # Let's try minimal config first. If 8.4 fails with default-auth-plugin, we will remove it.
  # We will rely on built-in defaults for 8.4 unless necessary.
  mysql84-1:
    image: mysql:8.4.7
    container_name: mysql84-1
    restart: always
    hostname: mysql84-1
    command: ["mysqld", "--server-id=11", "--gtid_mode=ON", "--enforce_gtid_consistency=ON", "--binlog_checksum=NONE"]
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_ROOT_HOST: '%'
    ports:
      - "33065:3306"
    networks:
      - cluster_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql84-2:
    image: mysql:8.4.7
    container_name: mysql84-2
    restart: always
    hostname: mysql84-2
    command: ["mysqld", "--server-id=12", "--gtid_mode=ON", "--enforce_gtid_consistency=ON", "--binlog_checksum=NONE"]
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_ROOT_HOST: '%'
    ports:
      - "33066:3306"
    networks:
      - cluster_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql84-3:
    image: mysql:8.4.7
    container_name: mysql84-3
    restart: always
    hostname: mysql84-3
    command: ["mysqld", "--server-id=13", "--gtid_mode=ON", "--enforce_gtid_consistency=ON", "--binlog_checksum=NONE"]
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_ROOT_HOST: '%'
    ports:
      - "33067:3306"
    networks:
      - cluster_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MySQL Shell for Bootstrapping
  cluster-setup:
    build:
      context: .
      dockerfile: Dockerfile.cluster-setup
    container_name: cluster-setup
    volumes:
      - ./cluster_setup.py:/script/cluster_setup.py
    # entrypoint is defined in Dockerfile, but we can override or leave it. 
    # Dockerfile has ENTRYPOINT ["tail", ...]. 
    # docker-compose override entrypoint line is:
    # entrypoint: ["tail", "-f", "/dev/null"]
    # We can remove it from here or keep it. Let's keep it to be safe or remove if redundant.
    # But wait, 'image' key should be removed.
    networks:
      - cluster_net

networks:
  cluster_net:
    driver: bridge
